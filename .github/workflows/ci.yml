name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Snapshot tests run in "check" mode: missing or changed snapshots fail.
  CI: "true"

jobs:
  lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check python tests examples benches

  rust:
    name: Rust (fmt, clippy, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --no-default-features

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip maturin pytest pyyaml pydantic
          maturin build --release --out dist
          python -m pip install dist/*.whl
      - name: Tests (snapshots must match byte for byte on every OS)
        run: python -m pytest -p no:cacheprovider
      - name: Overhead benchmark (< 0.5 ms per block)
        run: python benches/determinism_overhead.py --number 500

  locale:
    name: Locale independence (LANG=C)
    runs-on: ubuntu-latest
    env:
      LANG: C
      LC_ALL: C
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          python -m pip install maturin pytest pyyaml pydantic
          maturin build --release --out dist
          python -m pip install dist/*.whl
          python -X utf8 -m pytest -p no:cacheprovider

  js:
    name: JS/WASM build + cross-language parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/beacon-js
      # Prebuilt wasm-bindgen CLI; version MUST match the `wasm-bindgen` crate
      # pinned in crates/beacon-js/Cargo.toml (=0.2.130).
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clippy (beacon-js, wasm target)
        run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings
        working-directory: crates/beacon-js
      - name: Build the npm package (wasm + bindings)
        run: node crates/beacon-js/build.mjs
      - name: Node ESM smoke test
        run: node crates/beacon-js/test/smoke.mjs
      - name: Build and install the wheel (for the parity corpus)
        shell: bash
        run: |
          python -m pip install --upgrade pip maturin pytest
          maturin build --release --out dist
          python -m pip install dist/*.whl
      - name: Cross-language parity (byte-identical Python vs JavaScript)
        run: python -m pytest -p no:cacheprovider tests/test_parity_js.py

  integrations:
    name: Framework integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          python -m pip install maturin pytest pyyaml
          maturin build --release --out dist
          python -m pip install dist/*.whl "langchain-core>=1" "llama-index-core>=0.14" "pydantic-ai-slim>=2" "dspy>=3" openai
      - run: python -m pytest -p no:cacheprovider tests/test_integration_*.py
      - name: Examples run offline
        env:
          PYDANTIC_AI_NO_BANNER: "1"
        run: |
          for f in examples/0[1-7]_*.py; do echo "::group::$f"; python "$f"; echo "::endgroup::"; done
          python -m pytest -p no:cacheprovider examples/08_snapshot_testing_your_app.py
