name: Docs site

# Builds the documentation site (Astro + Starlight) and the playground's
# WebAssembly engine to catch breakage. Deploys are handled by Vercel's own Git
# integration (the site is served at https://www.anshumanbuilds.dev/beacon/).

on:
  push:
    branches: [main]
    paths: ["website/**", "src/**", "python/**", "Cargo.toml", "Cargo.lock", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["website/**", "src/**", "python/**", "Cargo.toml", "Cargo.lock"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: website/wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run wasm
        working-directory: website
      - run: npm run build && node scripts/nest-dist.mjs
        working-directory: website
        env:
          SITE_URL: https://www.anshumanbuilds.dev
          BASE_PATH: /beacon
      - uses: actions/upload-artifact@v4
        with:
          name: beacon-docs-dist
          path: website/dist
