[workspace]
resolver = "3"
members = ["crates/beacon-core", "crates/beacon-python"]
# beacon-wasm targets wasm32 and keeps its own size-tuned [profile.release]
# (opt-level = "z", panic = "abort", strip). Cargo only honours [profile.*] at
# the workspace root, so a shared profile would either bloat the Python wheel or
# de-tune the playground wasm. It is excluded to preserve both; it still
# path-depends on beacon-core.
exclude = ["crates/beacon-wasm", "crates/beacon-js"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/IND-Anshuman/beacon"
homepage = "https://www.anshumanbuilds.dev/beacon/"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
